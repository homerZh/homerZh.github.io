<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>血压与血糖记录 · Homer</title>
  <link rel="stylesheet" href="assets/blood-pressure.css?v=20261005b">
  <script defer src="cloudbase.config.js"></script>
  <script defer src="assets/blood-pressure.js?v=20261006"></script>
</head>
<body>
  <div class="shell">
    <header><a href="./">← 工具箱</a><span>血压与血糖记录</span><button id="logout" type="button" hidden>退出登录</button></header>
    <main>
      <h1>血压与血糖记录</h1>
      <p id="status" role="status" aria-live="polite">正在连接…</p>
      <button id="retry" type="button" hidden>重新连接</button>
      <form id="login" hidden>
        <h2>登录后记录</h2>
        <div class="login-fields">
          <label>用户名<input id="username" value="homer" autocomplete="username" required></label>
          <label>密码<input id="password" type="password" autocomplete="current-password" required></label>
          <button type="submit">登录</button>
        </div>
      </form>
      <section class="panel" aria-labelledby="record-title">
        <h2 id="record-title">新增记录</h2>
        <form id="record-form">
          <fieldset class="time-options" id="pressure-time-options">
            <legend>记录时间</legend>
            <label><input type="radio" name="time-mode" value="current" checked> 当前时间</label>
            <label><input type="radio" name="time-mode" value="historical"> 补录历史</label>
          </fieldset>
          <label class="date-field">日期和时间<input id="recorded-at" type="datetime-local" required></label>
          <p class="hint" id="time-hint">保存时会采用当前时间。</p>
          <div class="measurement-grid">
            <label>上压 <small>mmHg</small><input id="systolic" type="number" min="1" max="300" step="1" inputmode="numeric" required></label>
            <label>下压 <small>mmHg</small><input id="diastolic" type="number" min="1" max="300" step="1" inputmode="numeric" required></label>
            <label>心跳 <small>次/分钟</small><input id="pulse" type="number" min="1" max="300" step="1" inputmode="numeric" required></label>
          </div>
          <div class="form-actions"><button id="save" type="submit" disabled>保存记录</button><button id="pressure-cancel" type="button" class="secondary" hidden>取消修改</button></div>
          <p id="pressure-status" class="record-status" role="status" aria-live="polite"></p>
        </form>
      </section>
      <section class="history" aria-labelledby="history-title">
        <div class="history-heading"><div><h2 id="history-title">历史记录</h2><p>显示最近 50 条，较早记录仍保存在数据库中。</p></div><button id="reload" type="button" class="secondary" disabled>重新读取</button></div>
        <ul id="records"></ul>
      </section>
      <section class="glucose-section" aria-labelledby="glucose-title">
        <h2 id="glucose-title">血糖记录</h2>
        <div class="panel" aria-labelledby="glucose-record-title">
          <h3 id="glucose-record-title">新增记录</h3>
          <form id="glucose-form">
            <fieldset class="time-options" id="glucose-time-options">
              <legend>记录时间</legend>
              <label><input type="radio" name="glucose-time-mode" value="current" checked> 当前时间</label>
              <label><input type="radio" name="glucose-time-mode" value="historical"> 补录历史</label>
            </fieldset>
            <label class="date-field">日期和时间<input id="glucose-recorded-at" type="datetime-local" required></label>
            <p class="hint" id="glucose-time-hint">保存时采用服务器当前时间（北京时间）。</p>
            <div class="glucose-fields">
              <label>血糖 <small>mmol/L</small><input id="glucose-value" type="number" min="0.01" max="100" step="0.01" inputmode="decimal" required></label>
              <label>测量时段<small aria-hidden="true">&nbsp;</small><select id="glucose-relation" required><option value="">请选择</option><option value="fasting">空腹</option><option value="before_meal">餐前</option><option value="after_meal">餐后</option><option value="bedtime">睡前</option></select></label>
              <div id="after-meal-field" class="after-meal-group" hidden>
                <label>餐后经过 <small>分钟，可选</small><input id="after-meal-minutes" type="number" min="1" max="1440" step="1" inputmode="numeric" placeholder="例如 120"></label>
                <div class="after-meal-shortcuts" aria-label="常用餐后时间">
                  <button type="button" data-minutes="30">30分钟</button>
                  <button type="button" data-minutes="60">1小时</button>
                  <button type="button" data-minutes="90">1.5小时</button>
                  <button type="button" data-minutes="120">2小时</button>
                  <button type="button" data-minutes="135">2.25小时</button>
                  <button type="button" data-minutes="150">2.5小时</button>
                </div>
              </div>
            </div>
            <div class="form-actions"><button id="glucose-save" type="submit" disabled>保存血糖记录</button><button id="glucose-cancel" type="button" class="secondary" hidden>取消修改</button></div>
            <p id="glucose-status" role="status" aria-live="polite"></p>
          </form>
        </div>
        <section class="history" aria-labelledby="glucose-history-title">
          <div class="history-heading"><div><h3 id="glucose-history-title">血糖历史</h3><p>显示最近 50 条，较早记录仍保存在数据库中。</p></div><button id="glucose-reload" type="button" class="secondary" disabled>重新读取</button></div>
          <ul id="glucose-records"></ul>
        </section>
      </section>
    </main>
  </div>
</body>
</html>
