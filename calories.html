<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>饮食热量 · Homer</title><link rel="stylesheet" href="assets/calories.css"><script defer src="cloudbase.config.js"></script><script defer src="assets/calories.js"></script></head>
<body><div class="shell"><header><a href="./">← 工具箱</a><span>饮食热量</span><button id="logout" hidden>退出登录</button></header>
<main><div class="heading"><div><p class="eyebrow">饮食记录</p><h1>每日热量</h1></div><label class="date-label">查看日期<input type="date" id="date"></label></div>
<section class="goal"><div><span class="muted">体重目标</span><div class="weight">90 <small>kg</small><span> → </span>75 <small>kg</small></div><p id="period">半年计划</p></div><div class="goal-detail"><span class="muted">计划累计差额</span><strong>115,500 <small>千卡</small></strong><p id="daily-target"></p></div></section>
<p id="status" role="status" aria-live="polite">正在连接…</p>
<form id="login" hidden><h2>登录后记录</h2><div class="login-fields"><label>用户名<input id="username" value="homer" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button>登录</button></div></form>
<section class="stats" aria-label="统计"><div><span>已记录摄入</span><strong id="intake">—</strong><small id="coverage">未读取</small></div><div><span>当天净减少</span><strong id="day-diff">—</strong><small>多吃会抵扣差额</small></div><div><span>计划累计净减少</span><strong id="total-diff">—</strong><small id="progress-text">未读取</small></div></section>
<div class="progress-track"><div id="progress"></div></div>
<div class="section-heading"><h2>三餐记录</h2><span>未记录的餐次，差额计 0</span></div>
<section id="meals" class="meals"></section>
<details class="settings"><summary>基准与计划设置</summary><p>每日基准是对比用的固定值，不是建议摄入量。调整仅用于后续新记录，已有记录保留当时基准。</p><form id="settings-form"><div class="setting-grid"><label>早餐基准 · 千卡<input id="base-breakfast" type="number" min="1" max="10000" value="550" required></label><label>中餐基准 · 千卡<input id="base-lunch" type="number" min="1" max="10000" value="880" required></label><label>晚餐基准 · 千卡<input id="base-dinner" type="number" min="1" max="10000" value="770" required></label><label>计划开始日期<input id="start-date" type="date" required></label></div><button id="save-settings" disabled>保存设置</button></form></details>
<footer>仅用于个人记录与自我激励。初始基准为暂定 2200 千卡；目标按 15 × 7700 换算，不代表实际减重预测。<a href="https://www.niddk.nih.gov/health-information/professionals/diabetes-discoveries-practice/nih-body-weight-planner" target="_blank" rel="noopener noreferrer">估算说明 ↗</a></footer>
</main></div></body></html>
