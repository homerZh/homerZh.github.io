    @media(max-width:760px){.wrap{padding:0 23px}header{height:79px}.grid{grid-template-columns:repeat(2,1fr)}.card{padding:21px}nav{gap:20px}footer{margin-top:40px}.intro{font-size:13px}}@media(max-width:470px){.grid{grid-template-columns:1fr}.brand{font-size:16px}.card{min-height:200px}.future{min-height:150px}.preview{font-size:10px}.count{margin-left:5px}.footer-right{display:none}h1{font-size:34px}.note{align-items:flex-start}}
